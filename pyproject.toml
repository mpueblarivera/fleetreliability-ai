[tool.poetry]
name = "fleetreliability-ai"
version = "0.1.0"
description = "Predictive Maintenance & Condition-Based Monitoring (CBM) System with Multi-Threshold Operational Risk Scoring and Monte Carlo Cost Optimization"
authors = ["Martín Puebla Rivera <martin.puebla.rivera@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "^2.1.0"
pandas = "^2.2.3"
scipy = "^1.14.1"
scikit-learn = "^1.5.2"
xgboost = "^2.1.2"
lightgbm = "^4.5.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.2"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
httpx = "^0.27.2"
black = "^24.10.0"
isort = "^5.13.2"
jupyter = "^1.1.1"
ipykernel = "^6.29.5"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
