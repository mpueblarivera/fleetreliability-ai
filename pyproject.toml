[project]
name = "fleetreliability-ai"
version = "0.1.0"
description = "Predictive Maintenance & Condition-Based Monitoring (CBM) System with Multi-Threshold Operational Risk Scoring and Monte Carlo Cost Optimization"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Martín Puebla Rivera", email = "martin.puebla.rivera@gmail.com" }
]
dependencies = [
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "scipy>=1.14.1",
    "scikit-learn>=1.5.2",
    "xgboost>=2.1.2",
    "lightgbm>=4.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
    "black>=24.10.0",
    "isort>=5.13.2",
    "jupyter>=1.1.1",
    "ipykernel>=6.29.5",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
